id: rhythm-bass-advanced
category: rhythm
type: bass
level: advanced
tempo: 100
bars: 4
key: "A minor"
prompt: "Create a 4-bar drum and bass loop at 100 BPM in A minor. Build a more complex groove with a syncopated kick, snare and ghost notes, and varied sixteenth-note hi-hats. Add an independent bass line in A minor using syncopation, rests, octave movement and rhythmic variation. Let the bass interact with the drums rather than simply following the kick, with a turnaround in bar 4."
objective: "Understand how the bass and drums can operate as independent but coordinated musical parts."
instructions: "Listen to the reference on a loop. Recreate it in Logic, then export your recreation and upload it here. This page cannot see your Logic session. A MIDI file is compared exactly. An audio file is an estimate."
