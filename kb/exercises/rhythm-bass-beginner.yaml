level: beginner
tempo: 100
bars: 4
key: "A minor"
prompt: "Create a 4-bar drum and bass loop at 100 BPM in A minor. Use a simple drum pattern with kick on beats 1 and 3, snare on beats 2 and 4, and steady eighth-note hi-hats. Add a simple bass line using root notes from A minor that follows the kick rhythm. Keep it repetitive and easy to identify by ear."
objective: "Understand how a simple bass line follows and reinforces the rhythm established by the drums."
instructions: "Listen to the reference on a loop. Recreate it in Logic, then export your recreation and upload it here. This page cannot see your Logic session. A MIDI file is compared exactly. An audio file is an estimate."
