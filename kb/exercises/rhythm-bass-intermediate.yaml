key: "A minor"
prompt: "Create a 4-bar drum and bass loop at 100 BPM in A minor. Use a syncopated kick pattern, snare on beats 2 and 4, and sixteenth-note hi-hats with some velocity variation. Add a bass line using notes from A minor that locks in with the kick but includes syncopation and rhythmic variation. Add a small variation in bar 4."
objective: "Recreate a bass line that combines rhythmic variation with coordination between the bass and drums."
instructions: "Listen to the reference on a loop. Recreate it in Logic, then export your recreation and upload it here. This page cannot see your Logic session. A MIDI file is compared exactly. An audio file is an estimate."
