name: Build VST3 + AU Plugin

env:
  BUILD_TYPE: Release

on:
  push:
    branches: [ release ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # Windows — VST3 (Ableton Live, FL Studio)
  # ---------------------------------------------------------------
  windows-vst3:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Activates the MSVC Developer Command Prompt environment variables
    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64 # Options: x64, x86, amd64_x86, etc.

    - name: Configure CMake
      run: |

        cmake -A x64 -S "${{ github.workspace }}\vst_plugin" -B "${{ github.workspace }}\vst_plugin\build" -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
      shell: cmd

    - name: Build Project
      run: |
        cmake --build "${{ github.workspace }}\vst_plugin\build" --config ${{ env.BUILD_TYPE }} -j2
      shell: cmd

    - name: Upload Windows VST3 artifact
      uses: actions/upload-artifact@v4
      with:
        name: ADE-Hack-Windows-VST3
        path: vst_plugin/build/ADEHack_artefacts/Release/VST3/ADE Hack.vst3/**
        retention-days: 7

  # ---------------------------------------------------------------
  # macOS — VST3 + AU (Ableton Live, FL Studio, Logic Pro)
  # ---------------------------------------------------------------
  macos-au-vst3:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22.x'

      - name: Configure CMake (macOS VST3 + AU)
        run: |
          cmake -S vst_plugin -B vst_plugin/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build (macOS VST3 + AU)
        run: |
          cmake --build vst_plugin/build --config Release -j$(sysctl -n hw.ncpu)

      - name: Upload macOS AU + VST3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ADE-Hack-macOS-AU-VST3
          path: |
            vst_plugin/build/ADEHack_artefacts/Release/AU/ADE Hack.component/**
            vst_plugin/build/ADEHack_artefacts/Release/VST3/ADE Hack.vst3.macOS/**
          retention-days: 7
