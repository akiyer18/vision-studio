name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: npm ci --prefix apps/web
      - run: uv sync --frozen
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make build
