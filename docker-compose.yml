services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vision
      POSTGRES_PASSWORD: vision
      POSTGRES_DB: vision
    ports:
      - "5432:5432"
    volumes:
      - vision_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vision -d vision"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vision
      MINIO_ROOT_PASSWORD: visionvision
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - vision_minio:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 vision visionvision;
      mc mb -p local/vision-studio || true;
      exit 0;
      "

volumes:
  vision_pg:
  vision_minio:
