app = "vision-studio-api-staging"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PROVIDER = "mock"
  RENDERER = "mock"
  QUEUE = "redis"
  STORAGE = "s3"
  AUTH_REQUIRED = "0"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
